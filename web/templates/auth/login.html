{% extends "base.html" %}
{% block title %}Connexion — ENSAJ{% endblock %}
{% block content %}
<div class="min-h-[70vh] flex flex-col items-center justify-center">
    <div class="w-full max-w-md">
        
        <div class="text-center mb-10">
            <div class="w-20 h-20 bg-ethical-600 text-white rounded-3xl flex items-center justify-center text-4xl mx-auto mb-6 shadow-xl shadow-ethical-600/20">
                <i class="bi bi-shield-lock-fill"></i>
            </div>
            <h2 class="text-3xl font-black text-slate-900">Authentification</h2>
            <p class="text-slate-500 mt-2 font-medium">Accédez à l'espace de confiance forensique.</p>
        </div>

        <div class="card-ethic p-10 bg-white">
            <form method="POST" class="space-y-6">
                <div class="space-y-2">
                    <label class="block text-[11px] font-black text-slate-400 uppercase tracking-widest ml-1">Identifiant Personnel</label>
                    <div class="relative group">
                        <span class="absolute inset-y-0 left-0 pl-4 flex items-center text-slate-400 group-focus-within:text-ethical-600 transition-colors">
                            <i class="bi bi-person-fill text-lg"></i>
                        </span>
                        <input type="text" name="username" class="w-full bg-slate-50 border border-slate-200 rounded-2xl py-4 pl-12 pr-4 text-slate-900 focus:outline-none focus:ring-4 focus:ring-ethical-50 focus:border-ethical-600 focus:bg-white transition-all font-medium" placeholder="Nom d'utilisateur" required>
                    </div>
                </div>

                <div class="space-y-2">
                    <label class="block text-[11px] font-black text-slate-400 uppercase tracking-widest ml-1">Code d'accès</label>
                    <div class="relative group">
                        <span class="absolute inset-y-0 left-0 pl-4 flex items-center text-slate-400 group-focus-within:text-ethical-600 transition-colors">
                            <i class="bi bi-lock-fill text-lg"></i>
                        </span>
                        <input type="password" name="password" class="w-full bg-slate-50 border border-slate-200 rounded-2xl py-4 pl-12 pr-4 text-slate-900 focus:outline-none focus:ring-4 focus:ring-ethical-50 focus:border-ethical-600 focus:bg-white transition-all font-medium" placeholder="••••••••" required>
                    </div>
                </div>

                <div class="flex items-center justify-between px-1">
                    <div class="flex items-center">
                        <input id="remember-me" type="checkbox" class="h-4 w-4 text-ethical-600 focus:ring-ethical-600 border-slate-300 rounded cursor-pointer">
                        <label for="remember-me" class="ml-2 block text-xs text-slate-500 font-bold cursor-pointer">Mémoriser la session</label>
                    </div>
                    <div class="text-xs">
                        <a href="#" class="font-black text-ethical-600 hover:text-ethical-700">Accès perdu ?</a>
                    </div>
                </div>

                <div class="pt-4">
                    <button type="submit" class="w-full bg-slate-900 text-white font-black py-4 px-4 rounded-2xl shadow-xl shadow-slate-900/20 hover:bg-slate-800 transition-all flex items-center justify-center gap-2">
                        Se connecter <i class="bi bi-arrow-right"></i>
                    </button>
                </div>
            </form>
        </div>

        <div class="mt-12 flex items-center justify-center gap-6 opacity-40 grayscale group hover:grayscale-0 hover:opacity-100 transition-all duration-700">
            <span class="text-[10px] font-black text-slate-400 uppercase tracking-[0.3em]">Éthique</span>
            <div class="w-1.5 h-1.5 bg-slate-300 rounded-full"></div>
            <span class="text-[10px] font-black text-slate-400 uppercase tracking-[0.3em]">Intégrité</span>
            <div class="w-1.5 h-1.5 bg-slate-300 rounded-full"></div>
            <span class="text-[10px] font-black text-slate-400 uppercase tracking-[0.3em]">Justice</span>
        </div>
    </div>
</div>
{% endblock %}
