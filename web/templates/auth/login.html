{% extends "base.html" %}
{% block title %}Connexion — ENSAJ{% endblock %}
{% block content %}
<div class="min-h-[80vh] flex flex-col items-center justify-center">
    <div class="w-full max-w-md">
        
        <div class="text-center mb-8">
            <h2 class="text-3xl font-bold text-white">Authentification</h2>
            <p class="text-slate-400 mt-2 text-sm">Accédez à votre espace sécurisé forensique.</p>
        </div>

        <div class="bg-dark-lighter p-8 rounded-3xl border border-slate-700 shadow-2xl">
            <form method="POST" class="space-y-5">
                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase tracking-widest mb-2">Identifiant</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-4 flex items-center text-slate-500">
                            <i class="bi bi-person"></i>
                        </span>
                        <input type="text" name="username" class="w-full bg-slate-900 border border-slate-700 rounded-2xl py-3 pl-11 pr-4 text-slate-200 focus:outline-none focus:border-dark-accent transition-colors" placeholder="Nom d'utilisateur" required>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase tracking-widest mb-2">Mot de passe</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-4 flex items-center text-slate-500">
                            <i class="bi bi-lock"></i>
                        </span>
                        <input type="password" name="password" class="w-full bg-slate-900 border border-slate-700 rounded-2xl py-3 pl-11 pr-4 text-slate-200 focus:outline-none focus:border-dark-accent transition-colors" placeholder="••••••••" required>
                    </div>
                </div>

                <div class="flex items-center justify-between">
                    <div class="flex items-center">
                        <input id="remember-me" type="checkbox" class="h-4 w-4 text-dark-accent focus:ring-dark-accent border-slate-700 rounded bg-slate-900">
                        <label for="remember-me" class="ml-2 block text-xs text-slate-400">Se souvenir de moi</label>
                    </div>
                    <div class="text-xs">
                        <a href="#" class="font-medium text-dark-accent hover:text-blue-400">Mot de passe oublié ?</a>
                    </div>
                </div>

                <div class="pt-2">
                    <button type="submit" class="w-full btn-primary text-white font-bold py-3 px-4 rounded-2xl shadow-lg shadow-blue-500/20">
                        Se connecter
                    </button>
                </div>
            </form>
        </div>

        <p class="text-center mt-8 text-slate-500 text-xs uppercase tracking-widest">
            &copy; 2026 ENSAJ — Plateforme Sécurisée
        </p>
    </div>
</div>
{% endblock %}
